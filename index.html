<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>サーバー門番</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#1b2040">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&family=Zen+Kaku+Gothic+New:wght@400;700&family=DotGothic16&display=swap">
<style>
/* Layout: one-screen night-shift diorama — sky (canvas) on top, a wall of door buttons, the server room and a terminal strip below */
:root{
  --night:#1b2040; --panel:#252b52; --wall:#383e6e; --wall-edge:#4b5290;
  --amber:#ffb547; --amber-deep:#c97c12;
  --guest:#6cc4ff; --attacker:#ff6f6b;
  --ink:#eef0ff; --muted:#a3a8d2; --shut:#5c6195; --shut-deep:#3a3f6b;
  --ok:#7be0a4;
  --f-display:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN",system-ui,sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --f-term:"DotGothic16",ui-monospace,"Menlo",monospace;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--ink);font-family:var(--f-body);overflow:hidden;-webkit-tap-highlight-color:transparent}
.app{height:100%;display:grid;grid-template-rows:auto 1fr auto auto auto;max-width:520px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 12px;gap:8px}
.hud{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.stage{font-family:var(--f-display);font-weight:800;font-size:15px;letter-spacing:.04em}
.stage small{display:block;font-weight:500;font-size:11px;color:var(--muted);letter-spacing:.08em}
.meters{margin-left:auto;display:flex;gap:12px;font-size:12px;color:var(--muted)}
.meter{display:flex;align-items:center;gap:4px}
.pip{width:10px;height:10px;border-radius:50%;background:var(--shut-deep);transition:background .2s,transform .2s}
.meter.hp .pip.on{background:var(--attacker)}
.meter.tr .pip.on{background:var(--guest)}
.timebar{flex-basis:100%;height:5px;border-radius:3px;background:var(--panel);overflow:hidden}
.timebar i{display:block;height:100%;width:0;background:var(--amber);border-radius:3px}
.skywrap{position:relative;min-height:0;border-radius:14px 14px 4px 4px;overflow:hidden;background:var(--panel)}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.skylabel{position:absolute;top:8px;left:10px;font-size:11px;color:var(--muted);letter-spacing:.08em;pointer-events:none}
.doors{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;background:var(--wall);padding:8px 6px 10px;border-radius:4px;box-shadow:inset 0 -3px 0 var(--wall-edge)}
.door{all:unset;cursor:pointer;touch-action:manipulation;display:grid;justify-items:center;gap:2px;padding:8px 2px 7px;border-radius:12px 12px 8px 8px;
  background:var(--amber);color:#3a2300;box-shadow:0 5px 0 var(--amber-deep),0 0 18px rgba(255,181,71,.35);
  transform:translateY(0);transition:transform .06s,box-shadow .06s,background .15s}
.door .num{font-family:var(--f-term);font-size:17px;line-height:1}
.door .nm{font-size:10px;font-weight:700;white-space:nowrap}
.door .st{font-family:var(--f-display);font-weight:800;font-size:11px;letter-spacing:.1em}
.door:active,.door.press{transform:translateY(4px);box-shadow:0 1px 0 var(--amber-deep),0 0 10px rgba(255,181,71,.25)}
.door.closed{background:repeating-linear-gradient(180deg,var(--shut) 0 6px,var(--shut-deep) 6px 8px);color:var(--ink);box-shadow:0 5px 0 #262a4d}
.door.closed:active,.door.closed.press{box-shadow:0 1px 0 #262a4d}
.door:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.door.hit{animation:hit .3s}
.door.sad{animation:sad .4s}
@keyframes hit{30%{filter:brightness(1.6)}60%{transform:translateY(2px) rotate(-2deg)}}
@keyframes sad{25%{transform:translateX(-3px)}50%{transform:translateX(3px)}75%{transform:translateX(-2px)}}
.room{display:flex;align-items:center;gap:8px;background:var(--panel);border-radius:8px;padding:8px 10px;font-size:12px;transition:background .25s}
.room .flow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:0}
.chip{padding:3px 8px;border-radius:99px;background:var(--night);font-weight:700;font-size:11px}
.arrow{color:var(--muted)}
.room .count{margin-left:auto;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.room.good{background:#244a52}.room.bad{background:#5a2b3e}
.term{font-family:var(--f-term);font-size:13px;background:#0f1229;border-radius:8px;padding:8px 10px;min-height:44px;line-height:1.5;overflow:hidden}
.term .c{color:var(--ok)}.term .m{color:var(--muted)}
.overlay{position:fixed;inset:0;display:flex;flex-direction:column;background:rgba(14,17,38,.86);z-index:5;overflow-y:auto;
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.card{background:var(--panel);border-radius:18px;padding:22px 20px;max-width:440px;width:100%;display:grid;gap:14px;box-shadow:0 12px 0 #14183a}
.card h1{font-family:var(--f-display);font-weight:800;font-size:26px;margin:0;text-wrap:balance}
.eyebrow{font-size:11px;letter-spacing:.14em;color:var(--amber);font-weight:700}
.card p{margin:0;line-height:1.75;font-size:14px;color:var(--ink)}
.legend{display:grid;gap:8px;font-size:13px}
.legend div{display:flex;align-items:center;gap:10px}
.dot{width:20px;height:20px;border-radius:50%;flex:none}
.dot.g{background:var(--guest)}
.dot.r{background:var(--attacker);clip-path:polygon(50% 0,63% 25%,93% 18%,80% 45%,100% 62%,72% 72%,70% 100%,50% 82%,30% 100%,28% 72%,0 62%,20% 45%,7% 18%,37% 25%)}
.dot.d{border-radius:5px;background:var(--amber)}
.big{all:unset;cursor:pointer;touch-action:manipulation;text-align:center;font-family:var(--f-display);font-weight:800;font-size:18px;padding:14px;border-radius:14px;background:var(--amber);color:#3a2300;box-shadow:0 6px 0 var(--amber-deep);transition:transform .06s,box-shadow .06s}
.big:active{transform:translateY(5px);box-shadow:0 1px 0 var(--amber-deep)}
.big:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.big:disabled{cursor:default;background:var(--shut-deep);color:var(--muted);box-shadow:none;transform:none}
.overlay>.card{margin:auto}
/* stage select & navigation */
.back{all:unset;box-sizing:border-box;cursor:pointer;touch-action:manipulation;flex:none;display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--panel);color:var(--ink);font-size:20px;font-weight:800;box-shadow:0 3px 0 #14183a}
.back:active{transform:translateY(2px);box-shadow:0 1px 0 #14183a}
.sub{all:unset;box-sizing:border-box;cursor:pointer;touch-action:manipulation;text-align:center;font-weight:700;font-size:15px;padding:12px;border-radius:12px;background:var(--night);color:var(--ink);box-shadow:0 4px 0 #14183a;transition:transform .06s,box-shadow .06s}
.sub:active{transform:translateY(3px);box-shadow:0 1px 0 #14183a}
.back:focus-visible,.sub:focus-visible,.sl:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.btns{display:grid;gap:10px}
.lead{color:var(--muted)!important}
.stagelist{display:grid;gap:8px}
.sl{all:unset;box-sizing:border-box;cursor:pointer;touch-action:manipulation;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;padding:12px;border-radius:14px;background:var(--night);box-shadow:0 4px 0 #14183a;transition:transform .06s,box-shadow .06s}
.sl:active{transform:translateY(3px);box-shadow:0 1px 0 #14183a}
.sl .sn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--amber);color:#3a2300;font-family:var(--f-term);font-size:18px}
.sl .sm{display:grid;gap:2px;min-width:0}
.sl .sm b{font-family:var(--f-display);font-weight:800;font-size:16px}
.sl .sm small{font-size:12px;color:var(--muted)}
.sl .go{font-size:22px;font-weight:800;color:var(--amber)}
.sl.locked{cursor:default;opacity:.55;box-shadow:none}
.sl.locked:active{transform:none}
.sl.locked .sn{background:var(--shut-deep);color:var(--muted)}
.sl .rec{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:3px;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.sl .rs{font-size:13px;letter-spacing:1px;color:var(--amber)}
.sl .rs .off{color:var(--shut)}
.btop{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.sub.small{padding:8px 12px;font-size:13px;border-radius:10px}
.sub.skip{margin-left:auto;background:var(--amber);color:#3a2300;box-shadow:0 4px 0 var(--amber-deep)}
.sub.skip:active{box-shadow:0 1px 0 var(--amber-deep)}
.secs{display:grid;gap:18px}
.sec{display:grid;gap:8px}
.sec h2{margin:0;font-family:var(--f-display);font-weight:800;font-size:16px;color:var(--amber)}
.sec b{color:var(--ink)}
.ports{display:grid;gap:6px}
.pr{display:grid;grid-template-columns:48px 1fr;gap:8px;align-items:start;background:var(--night);border-radius:10px;padding:8px 10px;font-size:13px;line-height:1.6;color:var(--muted)}
.pr .pt{font-family:var(--f-term);font-size:16px;color:var(--ink)}
.pr b{display:block;font-size:13px}
.card .savenote{font-size:12px;color:var(--muted);line-height:1.6}
.lock{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;color:var(--muted);white-space:nowrap}
.stars{font-size:30px;letter-spacing:6px;color:var(--amber);text-align:center}
.stars .off{color:var(--shut)}
.review{display:grid;gap:6px}
.rv{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:start;font-size:13px;background:var(--night);border-radius:10px;padding:8px 10px}
.rv .pt{font-family:var(--f-term);font-size:15px;min-width:42px}
.rv .why{color:var(--muted);line-height:1.5}
.rv .why b{color:var(--ink)}
.rv .mk{font-weight:800}.rv .mk.ok{color:var(--ok)}.rv .mk.ng{color:var(--attacker)}
.real{background:#0f1229;border-radius:12px;padding:12px;display:grid;gap:6px;font-size:13px;line-height:1.6}
.real code{font-family:var(--f-term);font-size:15px;color:var(--ok)}
.next{font-size:13px;color:var(--muted);line-height:1.6}
/* stage 2: one SSH door + countermeasure buttons (same push-in feel as the stage 1 doors) */
.gate{display:flex;justify-content:center;align-items:center;gap:10px;background:var(--wall);padding:8px 6px 10px;border-radius:4px;box-shadow:inset 0 -3px 0 var(--wall-edge)}
.door22{pointer-events:none;min-width:150px;padding:7px 18px 6px}
.door22.keyonly{background:var(--ok);color:#0f3a24;box-shadow:0 5px 0 #3f9e69,0 0 18px rgba(123,224,164,.4)}
.badge{font-family:var(--f-term);font-size:11px;padding:3px 8px;border-radius:99px;background:var(--night);color:var(--ok)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.act{all:unset;box-sizing:border-box;position:relative;overflow:hidden;cursor:pointer;touch-action:manipulation;display:grid;place-items:center;text-align:center;min-height:52px;padding:8px 10px 10px;border-radius:12px;
  background:var(--amber);color:#3a2300;font-weight:700;font-size:12.5px;line-height:1.35;box-shadow:0 5px 0 var(--amber-deep);transform:translateY(0);transition:transform .06s,box-shadow .06s,background .15s,filter .15s}
.act:active:not(:disabled),.act.press{transform:translateY(4px);box-shadow:0 1px 0 var(--amber-deep)}
.act .ab{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(58,35,0,.12)}
.act .ab i{display:block;height:100%;width:0;background:#3a2300}
.act:disabled{cursor:default;filter:saturate(.45) brightness(.7)}
.act.busy{filter:none}
.act.done{background:var(--ok);color:#0f3a24;box-shadow:0 5px 0 #3f9e69;filter:none}
.act.done .al::before{content:'✓ '}
.act.done .ab{display:none}
.act.danger{grid-column:1/-1;min-height:40px;background:repeating-linear-gradient(180deg,var(--shut) 0 6px,var(--shut-deep) 6px 8px);color:var(--ink);box-shadow:0 5px 0 #262a4d}
.act.danger:active:not(:disabled),.act.danger.press{box-shadow:0 1px 0 #262a4d}
.act:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.act.hit{animation:hit .3s}.act.sad,.door22.sad{animation:sad .4s}
.app[data-stage="2"] .term{min-height:94px}
.meter.tries .tv{font-family:var(--f-term);font-size:14px;color:var(--ink);min-width:44px;text-align:right}
.meter.tries .tb{width:54px;height:8px;border-radius:4px;background:var(--shut-deep);overflow:hidden}
.meter.tries .tb i{display:block;height:100%;width:0;background:var(--amber);transition:width .15s}
.meter.tries.warn .tv{color:var(--attacker)}.meter.tries.warn .tb i{background:var(--attacker)}
.dot.k{background:var(--ok)}
.extra{display:grid;gap:10px}
.warn{background:#3d2338;border-radius:12px;padding:12px;font-size:13px;line-height:1.6;display:grid;gap:4px}
.warn ul{margin:0;padding-left:1.2em;display:grid;gap:4px}
.real .m{color:var(--muted);font-size:12px}
.rv .mk.na{color:var(--muted)}
.shake{animation:shk .35s}
@keyframes shk{20%{transform:translate(-6px,2px)}40%{transform:translate(5px,-3px)}60%{transform:translate(-4px,1px)}80%{transform:translate(3px,0)}}
@media (prefers-reduced-motion:reduce){.shake,.door.hit,.door.sad,.act.hit,.act.sad{animation:none}.door,.big,.act{transition:none}}
</style>
</head>
<body>

<div class="app" id="app">
  <div class="hud">
    <button class="back" id="hudBack" aria-label="ステージ一覧に戻る">‹</button>
    <div class="stage" id="hudTitle">ステージ1 門番<small>入口を開け閉めしてサーバーを守る</small></div>
    <div class="meters">
      <div class="meter hp" id="hp" data-only="1" aria-label="サーバー耐久">耐久 <i class="pip on"></i><i class="pip on"></i><i class="pip on"></i></div>
      <div class="meter tr" id="tr" data-only="1" aria-label="お客さんの信用">信用 <i class="pip on"></i><i class="pip on"></i><i class="pip on"></i></div>
      <div class="meter tries" id="tries" data-only="2" hidden aria-label="パスワードの試行回数">試行 <span class="tv" id="triesV">0/60</span><span class="tb"><i id="triesB"></i></span></div>
    </div>
    <div class="timebar"><i id="time"></i></div>
  </div>
  <div class="skywrap" id="sky"><canvas id="cv"></canvas><div class="skylabel">インターネット</div></div>
  <div class="doors" id="doors" data-only="1"></div>
  <div class="gate" id="gate" data-only="2" hidden>
    <div class="door door22" id="door22"><span class="num">22</span><span class="nm">SSH</span><span class="st" id="door22st">パスワード</span></div>
    <span class="badge" id="f2bBadge" hidden>fail2ban</span>
  </div>
  <div class="acts" id="acts" data-only="2" hidden></div>
  <div class="room" id="room">
    <div class="flow" id="roomFlow"><span class="chip">受付 nginx</span><span class="arrow">→</span><span class="chip">管理画面</span></div>
    <div class="count" id="count">来客 0 ・ 撃退 0</div>
  </div>
  <div class="term" id="term"><span class="m"># ドアをタップすると、本物のコマンドがここに出ます</span></div>
</div>

<div class="overlay" id="select">
  <div class="card">
    <div class="eyebrow">SERVER GATEKEEPER</div>
    <h1>サーバー門番</h1>
    <p class="lead">サーバーを守る仕事を、1面ずつ体で覚えよう。</p>
    <div class="stagelist" id="stageList"></div>
    <p class="savenote" id="saveNote" hidden>この端末では記録を保存できない設定になっています。遊ぶことはできますが、ページを閉じると記録は消えます。</p>
  </div>
</div>

<div class="overlay" id="brief" hidden>
  <div class="card">
    <div class="btop">
      <button class="sub small" id="briefBack">‹ ステージ一覧</button>
      <button class="sub small skip" id="briefSkip" hidden>スキップしてはじめる ›</button>
    </div>
    <div class="eyebrow" id="bEyebrow"></div>
    <h1 id="bTitle"></h1>
    <div class="secs" id="bBody"></div>
    <div class="btns">
      <button class="big" id="start">はじめる</button>
    </div>
  </div>
</div>

<div class="overlay" id="result" hidden>
  <div class="card">
    <div class="eyebrow" id="rEyebrow">STAGE 1 CLEAR</div>
    <h1 id="rTitle">守りきった！</h1>
    <div class="stars" id="rStars"></div>
    <p id="rSummary"></p>
    <div class="review" id="rReview"></div>
    <div class="extra" id="rExtra"></div>
    <div class="next" id="rNext"></div>
    <div class="btns">
      <button class="big" id="nextStage"></button>
      <button class="big" id="again">もう一回</button>
      <button class="sub" id="reread">ブリーフィングを読み返す</button>
      <button class="sub" id="resultBack">ステージ一覧に戻る</button>
    </div>
  </div>
</div>

<script>
const PORTS=[
  {p:80,  name:'HTTP',   open:true, why:'<b>お客さんの入口。</b>来た人を443へ案内する役'},
  {p:443, name:'HTTPS',  open:true, why:'<b>本命の入口。</b>通信が暗号化される鍵付きドア'},
  {p:3000,name:'Node直通',open:false,why:'<b>プログラムへの裏口。</b>受付(nginx)を通すから外には要らない'},
  {p:5432,name:'DB',     open:false,why:'<b>データの倉庫。</b>外から直接さわれたら全部盗まれる'},
  {p:8080,name:'テスト用',open:false,why:'<b>昔のテスト用。</b>使ってないドアは閉めるのが基本'}
];
const DUR=40;
/* ステージ一覧。ready:true のステージだけ遊べる（CLAUDE.md の「ステージ計画」と合わせる） */
const STAGES=[
  {id:1, name:'門番',         sub:'使ってないドア（ポート）を閉める', ready:true,
    hud:['ステージ1 門番','入口を開け閉めしてサーバーを守る'],
    room:'<span class="chip">受付 nginx</span><span class="arrow">→</span><span class="chip">管理画面</span>',
    brief:{
      situation:['あなたはWebアプリを動かすサーバーの管理人。サーバーには外とつながるドア（ポート）がたくさんあって、作ったばかりのときは使わないドアまで開いたままになっていることがよくある。世界中のボットは、サーバーを見つけると数分で全部のドアをノックしに来る。'],
      doors:[
        [80,  'HTTP',     'Webの入口。暗号化なし。来た人を443へ案内する役'],
        [443, 'HTTPS',    'Webの本命の入口。通信が暗号化される'],
        [3000,'Node直通', 'プログラムに直接つながる裏口。本来は受付係（nginx）が中で取り次ぐので、外に開ける必要はない'],
        [5432,'DB',       'データベース。データの倉庫。外から触れたら全部盗まれる'],
        [8080,'テスト用', '開発中に使ったまま放置されがちなドア']
      ],
      real:[
        'ゲームでは敵が赤くトゲトゲだけど、本物の通信に色はついていない。だから門番（ファイアウォール）は「誰が敵か」ではなく<b>「このドアは誰のためにあるか」</b>で判断する。お客さんが使うドアだけ開けて、それ以外は全部閉める。これが基本（<b>「最小限だけ開ける」の原則</b>）。',
        'ほかにも「どこから来たか（IPアドレス）」「ふるまい（何度もパスワードを間違える）」「中身（命令文が混ざっている）」で見分ける方法があり、それは次のステージ以降で学ぶ。'
      ],
      howto:`<div class="legend">
          <div><span class="dot g"></span>丸い青い玉 ＝ お客さん。通してあげる</div>
          <div><span class="dot r"></span>トゲのある赤い玉 ＝ 攻撃者。止める</div>
          <div><span class="dot d"></span>ドアはタップで開け閉め（キーボードなら1〜5）</div>
        </div>
        <p>玉に書いてある数字が、向かってるドアの番号です。40秒守りきったらクリア。</p>`
    }},
  {id:2, name:'鍵',           sub:'SSHへのパスワード総当たり', ready:true,
    hud:['ステージ2 鍵','22番の鍵を強くして守る'],

function today(){const d=new Date(),z=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`}

let AC=null;
function audio(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){AC=null}}
function tone(f,d,type='sine',v=.12,f2=null,delay=0){if(!AC)return;const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.02)}
function noise(d=.04,v=.15){if(!AC)return;const b=AC.createBuffer(1,AC.sampleRate*d,AC.sampleRate),a=b.getChannelData(0);
  for(let i=0;i<a.length;i++)a[i]=(Math.random()*2-1)*(1-i/a.length);const s=AC.createBufferSource(),g=AC.createGain(),fl=AC.createBiquadFilter();
  fl.type='bandpass';fl.frequency.value=1800;g.gain.value=v;s.buffer=b;s.connect(fl).connect(g).connect(AC.destination);s.start()}
const sfx={
  open(){noise(.03,.18);tone(520,.08,'square',.05,780)},
  close(){noise(.05,.22);tone(180,.12,'square',.07,90)},
  block(){tone(140,.15,'triangle',.18,60);noise(.06,.12)},
  welcome(){tone(660,.09,'sine',.1);tone(990,.14,'sine',.09,null,.07)},
  sad(){tone(400,.25,'triangle',.1,220)},
  breach(){tone(300,.35,'sawtooth',.09,70)},
  win(){[523,659,784,1047].forEach((f,i)=>tone(f,.18,'triangle',.11,null,i*.1))},
  done(){tone(880,.08,'triangle',.09);tone(1320,.12,'triangle',.08,null,.07)},
  lose(){[392,330,262].forEach((f,i)=>tone(f,.25,'triangle',.1,null,i*.14))}
};

/* ---------- game ---------- */
function pick(list){let r=Math.random(),a=0;for(const[k,w]of list){a+=w;if(r<=a)return k}return list[0][0]}
function newGame(){
  S={running:true,t:0,spawn:.6,hp:3,trust:3,balls:[],parts:[],served:0,blocked:0,open:PORTS.map(()=>true),last:performance.now()};
  [...doorsEl.children].forEach(b=>{b.classList.remove('closed');b.querySelector('.st').textContent='開';b.setAttribute('aria-pressed','false')});
  term('$ sudo ufw status','# 今は全部のドアが開いてる…');
  meters();count();
}
function spawn(){
  const prog=S.t/DUR,red=S.t>3&&Math.random()<.55;
  const i=red?pick([[2,.4],[3,.3],[4,.3]]):pick([[0,.3],[1,.7]]);
  S.balls.push({red,i,x0:20+Math.random()*(W-40),y:-20,x:0,age:0,dur:3.3-1.1*prog+Math.random()*.4,r:15,wob:Math.random()*6});
}
function resolve(b){
  const open=S.open[b.i],x=doorX[b.i];
  if(b.red&&open){S.hp--;sfx.breach();buzz([30,40,30]);flashRoom('bad');shake();term(`! ${PORTS[b.i].p}番から侵入された`,'# 使ってないドアは閉めよう');burst(x,H,'#ff6f6b',14,1)}
  else if(b.red){S.blocked++;sfx.block();buzz(8);pulse(b.i,'hit');burst(x,H-6,'#ff6f6b',10,-1)}
  else if(open){S.served++;sfx.welcome();flashRoom('good');burst(x,H,'#6cc4ff',8,1)}
  else{S.trust--;sfx.sad();buzz(20);pulse(b.i,'sad');term(`! お客さんが${PORTS[b.i].p}番で門前払い`,'# お客さん用のドアは開けておこう');burst(x,H-6,'#6cc4ff',8,-1)}
  meters();count();
}
function burst(x,y,c,n,dir){for(let k=0;k<n;k++)S.parts.push({x,y,vx:(Math.random()-.5)*160,vy:dir*(Math.random()*60+20)-(dir<0?80:0),life:.5+Math.random()*.3,c})}
function shake(){if(reduce)return;app.classList.remove('shake');void app.offsetWidth;app.classList.add('shake')}
function meters(){
  [['hp',S.hp],['tr',S.trust]].forEach(([id,v])=>[...document.getElementById(id).querySelectorAll('.pip')].forEach((p,k)=>p.classList.toggle('on',k<v)));
}
function count(){document.getElementById('count').textContent=`来客 ${S.served} ・ 撃退 ${S.blocked}`}

function loop(now){
  if(!S||!S.running||S.stage)return;
  const dt=Math.min(.05,(now-S.last)/1000);S.last=now;S.t+=dt;
  document.getElementById('time').style.width=Math.min(100,S.t/DUR*100)+'%';
  S.spawn-=dt;
  if(S.spawn<=0&&S.t<DUR-2){spawn();S.spawn=1.35-.7*(S.t/DUR)+Math.random()*.3}
  for(const b of S.balls){b.age+=dt;const k=Math.min(1,b.age/b.dur),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    b.x=b.x0+(doorX[b.i]-b.x0)*e+Math.sin(b.age*3+b.wob)*6*(1-k);b.y=-20+(H-b.r+20)*k;if(k>=1){b.done=true;resolve(b)}}
  S.balls=S.balls.filter(b=>!b.done);
  for(const p of S.parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=240*dt;p.life-=dt}
  S.parts=S.parts.filter(p=>p.life>0);
  draw(now);
  if(S.hp<=0||S.trust<=0)return end(false);
  if(S.t>=DUR&&!S.balls.length)return end(true);
  requestAnimationFrame(loop);
}

function draw(now){
  ctx.clearRect(0,0,W,H);
  for(const s of stars){ctx.globalAlpha=.35+.35*Math.sin(now/700+s.p);ctx.fillStyle='#c9ccff';ctx.fillRect(s.x,s.y,s.s,s.s)}
  ctx.globalAlpha=1;
  doorX.forEach((x,i)=>{const g=ctx.createLinearGradient(0,H*.45,0,H);const o=S?S.open[i]:true;
    g.addColorStop(0,'rgba(255,181,71,0)');g.addColorStop(1,o?'rgba(255,181,71,.22)':'rgba(92,97,149,.25)');ctx.fillStyle=g;ctx.fillRect(x-22,H*.45,44,H*.55)});
  if(!S)return;
  for(const b of S.balls){
    ctx.save();ctx.translate(b.x,b.y);
    if(b.red){ctx.rotate(b.age*2.5);ctx.beginPath();for(let k=0;k<14;k++){const a=k/14*Math.PI*2,r=k%2?b.r*.78:b.r*1.12;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}ctx.closePath();ctx.fillStyle='#ff6f6b';ctx.fill();ctx.rotate(-b.age*2.5)}
    else{ctx.beginPath();ctx.arc(0,0,b.r,0,Math.PI*2);ctx.fillStyle='#6cc4ff';ctx.fill();ctx.beginPath();ctx.arc(-5,-6,4,0,Math.PI*2);ctx.fillStyle='rgba(255,255,255,.55)';ctx.fill()}
    ctx.fillStyle='#14183a';ctx.font='10px "DotGothic16", monospace';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(PORTS[b.i].p,0,1);
    ctx.restore();
  }
  for(const p of S.parts){ctx.globalAlpha=Math.max(0,p.life*1.6);ctx.fillStyle=p.c;ctx.fillRect(p.x-2,p.y-2,4,4)}
  ctx.globalAlpha=1;
}

function end(win){
  S.running=false;win?sfx.win():sfx.lose();buzz(win?[20,60,20,60,40]:[80]);
  let correct=0;
  const rows=PORTS.map((pt,i)=>{const ok=S.open[i]===pt.open;if(ok)correct++;
    return `<div class="rv"><span class="pt">${pt.p}</span><span class="why">${pt.open?'開ける':'閉める'}：${pt.why}</span><span class="mk ${ok?'ok':'ng'}">${ok?'○':'×'}</span></div>`}).join('');
  const st=win?1+(S.hp===3?1:0)+(correct===5?1:0):0;
  finish(win,st,{
    eyebrow:win?'STAGE 1 CLEAR':'STAGE 1',
    title:win?'守りきった！':(S.hp<=0?'侵入されちゃった':'お客さんが帰っちゃった'),
    summary:win
      ?`来客 ${S.served}人を通して、攻撃を ${S.blocked}回止めました。最後のドアの状態はこうでした。`
      :'全部開けっぱなしだと攻撃者が入るし、全部閉めるとお客さんも入れない。正解はこうです。',
    review:rows,
    extra:`<div class="real">
      <div>本物のサーバーにも、この門番（ufw）がいます。まずは<b>見るだけ</b>のこれを打って、結果をClaudeに貼ってみよう。</div>
      <code>sudo ufw status</code>
    </div>`,
    next:'次のステージ2は「22番 SSH」。あなた自身が入るためのドアです。閉めると攻撃者は止まるけど、あなたも締め出される。さて、どうする？'
  });
}

/* 結果画面（全ステージ共通）：記録を保存して、★・振り返り・ボタンを出す */
function finish(win,st,o){
  const r=rec(cur);r.best=Math.max(r.best,st);if(win)r.clears++;r.last=today();saveRec();
  document.getElementById('rEyebrow').textContent=o.eyebrow;
  document.getElementById('rTitle').textContent=o.title;
  document.getElementById('rStars').innerHTML=starsHtml(st);
  document.getElementById('rSummary').textContent=o.summary;
  document.getElementById('rReview').innerHTML=o.review;
  document.getElementById('rExtra').innerHTML=o.extra||'';
  const rn=document.getElementById('rNext');rn.textContent=o.next||'';rn.hidden=!o.next;
  const nx=STAGES.find(s=>s.id===cur+1),nb=document.getElementById('nextStage'),ag=document.getElementById('again');
  nb.hidden=!win;
  nb.disabled=!(nx&&nx.ready);
  nb.innerHTML=!nx?'これで全ステージおしまい':nx.ready?`次のステージへ（${nx.id} ${nx.name}）`:`<span class="lock">${LOCK}</span> ステージ${nx.id}「${nx.name}」は準備中`;
  ag.className=win?'sub':'big';
  show('result');
  document.getElementById('result').scrollTop=0;
  (win&&!nb.disabled?nb:ag).focus({preventScroll:true});
}

    term2({cmd:['$ sudo systemctl restart ssh'],note:'# これでパスワードの当てずっぽうは効かない。入れるのは鍵を持つ人だけ'});
  }
  if(k==='key')term2({cmd:['$ ssh-copy-id user@サーバー'],note:'# 鍵を登録した。次は、本当に鍵で入れるか確かめよう'});
  if(k==='f2b')term2({cmd:['$ sudo systemctl status fail2ban'],note:'# 動いてる。何度も間違える相手は自動でブロックされる'});
  S.done[k]=true;sfx.done();buzz([10,30,10]);
  const b=actBtn(k);b&&pulseEl(b,'hit');
  door2();setBusy();
}
function lockout(why){
  // 設定を変えたあと、あなたが入り直そうとして…弾かれる
  S.lock=why;setBusy();spawnGreen({you:true});
}
function spawnGreen(o={}){
  const fast=o.test||o.you;
  S.balls.push({green:true,test:!!o.test,you:!!o.you,x0:20+Math.random()*(W-40),age:0,dur:fast?1.5:2.4,r:15,wob:Math.random()*6,x:0,y:-20});
}
function spawnRed(){
  const prog=S.t/DUR2;
  S.balls.push({red:true,x0:20+Math.random()*(W-40),age:0,dur:2.3-.5*prog+Math.random()*.3,r:14,wob:Math.random()*6,x:0,y:-20});
}
function float(txt,c){S.texts.push({x:door2X+(Math.random()-.5)*70,y:H-30-Math.random()*24,txt,c,life:1})}
function pulseEl(el,cls){el.classList.remove('hit','sad');void el.offsetWidth;el.classList.add(cls)}
function resolve2(b){
  const x=door2X;
  if(b.green){
    if(S.lock){
      if(!S.lockedOut){S.lockedOut=true;S.endAt=S.t+1.1;sfx.close();sfx.breach();buzz([40,40,90]);shake();flashRoom('bad');pulseEl(door22,'sad');
        float('締め出された！','#ff6f6b');term(`! 締め出された`,`# ${S.lock==='close'?'22番が閉まっていて入れない':'パスワードは禁止、鍵は使えない。もう入る方法がない'}`)}
      burst(x,H-6,'#7be0a4',10,-1);return;
    }
    if(b.test){
      S.busy=null;
      if(S.done.key){S.done.check=true;sfx.welcome();sfx.done();buzz([10,30,10]);flashRoom('good');float('鍵で入れた！','#7be0a4');burst(x,H,'#7be0a4',10,1);
        term('$ ssh user@サーバー','# 鍵で入れた！ これで安心してパスワードを禁止できる');const t=actBtn('check');t&&pulseEl(t,'hit')}
      else{S.mistakes++;sfx.sad();buzz(20);float('パスワードで入った','#a3a8d2');burst(x,H,'#7be0a4',6,1);
        term('! まだ鍵を登録していない','# 鍵が無いので、結局パスワードで入った。先に鍵を作って登録しよう');const t=actBtn('check');t&&pulseEl(t,'sad')}
      setBusy();return;
    }
    S.logins++;sfx.welcome();flashRoom('good');burst(x,H,'#7be0a4',8,1);float(S.done.key?'鍵で入った':'パスワードで入った','#7be0a4');count2();return;
  }
  // 赤い玉（攻撃者）
  if(S.closed||S.done.nopw){S.bounced++;sfx.block();buzz(6);burst(x,H-6,'#ff6f6b',8,-1);float(S.closed?'閉':'鍵がない','#a3a8d2');count2();return}
  if(S.done.f2b&&Math.random()<.67){S.bounced++;sfx.block();buzz(6);burst(x,H-6,'#ff6f6b',8,-1);float('BAN','#7be0a4');count2();return}
  S.tries++;noise(.03,.1);tone(240,.06,'square',.04);burst(x,H-4,'#ff6f6b',5,-1);float('+1','#ff6f6b');meters2();
  if(!S.warned&&S.tries>=LIMIT*.7&&!S.lock){S.warned=true;term(`! 試行 ${S.tries}回。そろそろ当てられる`,'# 急いで、でも順番は守って')}
}

function loop2(now){
  if(!S||!S.running||S.stage!==2)return;
  const dt=Math.min(.05,(now-S.last)/1000);S.last=now;S.t+=dt;
  document.getElementById('time').style.width=Math.min(100,S.t/DUR2*100)+'%';
  if(S.t<DUR2-1.5&&!S.lock){
    S.spawn-=dt;if(S.spawn<=0){spawnRed();S.spawn=.6-.25*(S.t/DUR2)+Math.random()*.15}
    S.gspawn-=dt;if(S.gspawn<=0){spawnGreen();S.gspawn=5+Math.random()*3}
  }
  if(S.busy&&S.busy!=='check'){const a=ACTS.find(x=>x.k===S.busy);S.busyT+=dt;const i=actBtn(S.busy).querySelector('.ab i');
    i.style.width=Math.min(100,S.busyT/a.dur*100)+'%';if(S.busyT>=a.dur)complete(S.busy)}
  if(S.busy==='check'){const tb=S.balls.find(b=>b.test);if(tb)actBtn('check').querySelector('.ab i').style.width=Math.min(100,tb.age/tb.dur*100)+'%'}
  for(const b of S.balls){b.age+=dt;const k=Math.min(1,b.age/b.dur),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    b.x=b.x0+(door2X-b.x0)*e+Math.sin(b.age*3+b.wob)*6*(1-k);b.y=-20+(H-b.r+20)*k;if(k>=1){b.done=true;resolve2(b)}}
  S.balls=S.balls.filter(b=>!b.done);
  for(const p of S.parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=240*dt;p.life-=dt}
  S.parts=S.parts.filter(p=>p.life>0);
  for(const t of S.texts){t.y-=28*dt;t.life-=dt*.9}
  S.texts=S.texts.filter(t=>t.life>0);
  draw2(now);
  if(!S.running)return;
  if(S.lockedOut&&S.t>=S.endAt)return end2(false,S.lock);
  if(S.tries>=LIMIT)return end2(false,'breach');
  if(S.t>=DUR2&&!S.lock)return end2(!!S.done.nopw,S.done.nopw?null:'timeout');
  requestAnimationFrame(loop2);
}

function draw2(now){
  ctx.clearRect(0,0,W,H);
  for(const s of stars){ctx.globalAlpha=.35+.35*Math.sin(now/700+s.p);ctx.fillStyle='#c9ccff';ctx.fillRect(s.x,s.y,s.s,s.s)}
  ctx.globalAlpha=1;
  const g=ctx.createLinearGradient(0,H*.4,0,H);
  g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,S.closed?'rgba(92,97,149,.28)':S.done.nopw?'rgba(123,224,164,.26)':'rgba(255,181,71,.24)');
  ctx.fillStyle=g;ctx.fillRect(door2X-46,H*.4,92,H*.6);
  for(const b of S.balls){
    ctx.save();ctx.translate(b.x,b.y);
    if(b.red){
      ctx.rotate(b.age*2.5);ctx.beginPath();for(let k=0;k<14;k++){const a=k/14*Math.PI*2,r=k%2?b.r*.78:b.r*1.12;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}
      ctx.closePath();ctx.fillStyle='#ff6f6b';ctx.fill();ctx.rotate(-b.age*2.5);
      ctx.fillStyle='#14183a';ctx.font='9px "DotGothic16", monospace';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('pw',0,1);
    }else{
      ctx.beginPath();ctx.arc(0,0,b.r,0,Math.PI*2);ctx.fillStyle='#7be0a4';ctx.fill();
      ctx.beginPath();ctx.arc(-5,-6,3.5,0,Math.PI*2);ctx.fillStyle='rgba(255,255,255,.5)';ctx.fill();
      // 鍵のマーク
      ctx.strokeStyle='#14183a';ctx.lineWidth=2.4;ctx.lineCap='round';
      ctx.beginPath();ctx.arc(-4,0,3.6,0,Math.PI*2);ctx.stroke();
      ctx.beginPath();ctx.moveTo(-.4,0);ctx.lineTo(8,0);ctx.moveTo(5,0);ctx.lineTo(5,3.5);ctx.moveTo(7.6,0);ctx.lineTo(7.6,2.6);ctx.stroke();
    }
    ctx.restore();
  }
  for(const p of S.parts){ctx.globalAlpha=Math.max(0,p.life*1.6);ctx.fillStyle=p.c;ctx.fillRect(p.x-2,p.y-2,4,4)}
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='700 13px "Zen Kaku Gothic New", sans-serif';
  for(const t of S.texts){ctx.globalAlpha=Math.max(0,Math.min(1,t.life*1.5));ctx.fillStyle=t.c;ctx.fillText(t.txt,t.x,t.y)}
  ctx.globalAlpha=1;
}

function end2(win,why){
  S.running=false;setBusy();win?sfx.win():sfx.lose();buzz(win?[20,60,20,60,40]:[80]);
  if(why==='breach'){sfx.breach();shake();flashRoom('bad');pulseEl(door22,'sad')}
  const fast=S.mistakes===0&&S.nopwAt!==null&&S.nopwAt<LIMIT/2;
  const st=win?1+(S.done.f2b?1:0)+(fast?1:0):0;
  const badPw=S.lock==='nokey'||S.lock==='nocheck';
  const R=[
    ['①',S.done.key,'<b>鍵を作って登録する。</b>パスワードは当てずっぽうでいつか当たるけど、鍵ファイルは長すぎて当てられない'],
    ['②',S.done.check,'<b>別の窓で、鍵で入れるか確かめる。</b>今の接続を切らずに確かめれば、失敗してもまだ直せる'],
    ['③',S.done.nopw&&!badPw,'<b>パスワードでのログインを禁止する。</b>これで当てずっぽう攻撃は効かなくなる。必ず①②のあと'],
    ['④',S.done.f2b?true:null,'<b>何度も失敗する相手を自動で締め出す（ボーナス）。</b>fail2ban が、ふるまいを見て自動でブロックする'],
    ['✕',!S.closed,'<b>22番は閉めない。</b>攻撃者は止まるけど、あなたも入れなくなる。閉めるのではなく、鍵を強くするドア']
  ];
  const rows=R.map(([n,ok,t])=>`<div class="rv"><span class="pt">${n}</span><span class="why">${t}</span><span class="mk ${ok===null?'na':ok?'ok':'ng'}">${ok===null?'－':ok?'○':'×'}</span></div>`).join('');
  const titles={close:'締め出された！',nokey:'締め出された！',nocheck:'締め出された！',breach:'パスワードを当てられた',timeout:'時間切れ'};
  const whys={...LOCKWHY,
    breach:'試行回数が60回に届いて、パスワードを当てられて乗っ取られた。パスワードのままだと、いつかは当たる。',
    timeout:'まだパスワードでログインできるまま。今日は耐えても、当てずっぽうはこの先もずっと続く。'};
  finish(win,st,{
    eyebrow:win?'STAGE 2 CLEAR':'STAGE 2',
    title:win?'鍵で守りきった！':titles[why],
    summary:(win
      ?`パスワード攻撃を ${S.bounced}回弾いて、あなたは ${S.logins}回ログインできました。`
      :whys[why])+' 正しい順番と理由はこうです。',
    review:rows,
    extra:`<div class="warn"><b>安全メモ（本物のサーバーで）</b><ul>
        <li>設定を変えるときは、今つないでいるSSHを絶対に切らない。別の窓で入れることを確かめてから閉じる</li>
        <li>鍵で入れることを確かめる前に、パスワードを禁止しない</li>
        <li>22番を ufw で閉めない（自分も入れなくなる）</li></ul></div>
      <div class="real">
        <div><b>本物で確かめよう（見るだけ）</b>。どちらも設定は何も変えません。結果をClaudeに貼ってみよう。</div>
        <code>sudo sshd -T | grep passwordauthentication</code>
        <div class="m">パスワードログインが許可されているか見る（yes なら許可、no なら禁止）。設定ファイルを直しても /etc/ssh/sshd_config.d/ の中の別ファイルで上書きされていることがあるので、最終的に効いている設定をこれで確かめる</div>
        <code>sudo journalctl -u ssh | grep "Failed password" | wc -l</code>
        <div class="m">今までに何回パスワード攻撃が来たか数える</div>
      </div>`,
    next:'次のステージ3は「緊急パッチ」。サーバーの部品に穴が見つかった。止めずに、確実に直せる？'
  });
}

/* ---------- screens ---------- */
function show(id){['select','brief','result'].forEach(k=>document.getElementById(k).hidden=k!==id)}
function renderList(){
  document.getElementById('stageList').innerHTML=STAGES.map(s=>s.ready
    ?`<button class="sl" data-id="${s.id}"><span class="sn">${s.id}</span><span class="sm"><b>${s.name}</b><small>${s.sub}</small>${recHtml(s.id)}</span><span class="go">›</span></button>`
    :`<button class="sl locked" disabled><span class="sn">${s.id}</span><span class="sm"><b>${s.name}</b><small>${s.sub}</small></span><span class="lock">${LOCK}準備中</span></button>`).join('');
  document.getElementById('saveNote').hidden=canSave;
}
function recHtml(id){
  const r=REC[id];
  if(!r||(!r.last&&!r.best))return '<span class="rec">まだ遊んでいません</span>';
  return `<span class="rec"><span class="rs">${starsHtml(r.best)}</span>クリア ${r.clears}回${r.last?` ・ 最後に遊んだ日 ${dayLabel(r.last)}`:''}</span>`;
}
function openList(){if(S)S.running=false;renderList();show('select');const f=document.querySelector('.sl:not(.locked)');f&&f.focus()}
/* ブリーフィング。mode='play'：遊ぶ前（2回目からはスキップできる）／'review'：結果画面から読み返す */
let briefMode='play';
function openBrief(id,mode){
  const s=STAGES.find(x=>x.id===id),b=s.brief;cur=id;briefMode=mode;
  document.getElementById('bEyebrow').textContent=`STAGE ${s.id} ブリーフィング`;
  document.getElementById('bTitle').textContent=s.name;
  document.getElementById('bBody').innerHTML=
    `<section class="sec"><h2>状況</h2>${b.situation.map(t=>`<p>${t}</p>`).join('')}</section>`+
    `<section class="sec"><h2>${b.doorsTitle||'ドアの番号の意味'}</h2><div class="ports">${b.doors.map(([p,n,t])=>`<div class="pr"><span class="pt">${p}</span><span><b>${n}</b>${t}</span></div>`).join('')}</div></section>`+
    `<section class="sec"><h2>現実ではどう見分けるか</h2>${b.real.map(t=>`<p>${t}</p>`).join('')}</section>`+
    `<section class="sec"><h2>遊び方</h2>${b.howto}</section>`;
  const review=mode==='review';
  document.getElementById('briefBack').textContent=review?'‹ 結果にもどる':'‹ ステージ一覧';
  document.getElementById('briefSkip').hidden=review||!rec(id).seen;
  document.getElementById('start').textContent=review?'もう一回':'はじめる';
  setLayout(id);show('brief');
  document.getElementById('brief').scrollTop=0;
  document.getElementById('briefBack').focus({preventScroll:true});
}
function openStage(id){openBrief(id,'play')}
/* ゲーム画面の部品を、そのステージ用に入れ替える（data-only="ステージ番号" の部品だけ見せる） */
function setLayout(id){
  const s=STAGES.find(x=>x.id===id);
  document.querySelectorAll('[data-only]').forEach(el=>el.hidden=el.dataset.only!==String(id));
  document.getElementById('hudTitle').innerHTML=`${s.hud[0]}<small>${s.hud[1]}</small>`;
  document.getElementById('roomFlow').innerHTML=s.room;
  app.dataset.stage=id;
}
const GAMES={
  1:()=>{newGame();requestAnimationFrame(loop)},
  2:()=>{newGame2();requestAnimationFrame(loop2)}
};
function start(){
  audio();show(null);
  const r=rec(cur);if(!r.seen){r.seen=true;saveRec()}
  if(S)S.running=false;
  setLayout(cur);resize();GAMES[cur]();S.last=performance.now();
}
document.getElementById('stageList').addEventListener('click',e=>{const b=e.target.closest('.sl:not(.locked)');if(b)openStage(+b.dataset.id)});
document.getElementById('start').addEventListener('click',start);
document.getElementById('briefSkip').addEventListener('click',start);
document.getElementById('briefBack').addEventListener('click',()=>briefMode==='review'?show('result'):openList());
document.getElementById('reread').addEventListener('click',()=>openBrief(cur,'review'));
document.getElementById('again').addEventListener('click',start);
document.getElementById('nextStage').addEventListener('click',()=>{const nx=STAGES.find(s=>s.id===cur+1);if(nx&&nx.ready)openStage(nx.id)});
['hudBack','resultBack'].forEach(id=>document.getElementById(id).addEventListener('click',openList));
resize();draw(0);renderList();
</script>
</body>
